<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="utf-8" />
    <title>Drum Machine</title>
  </head>
  <body>
<div id="drum-machine">
  <p id="display">Display</p>
  <div id="pad-bank">
    <button name="Heater 1" class="drum-pad">Q<audio class="clip" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3" id="Q"></audio></button>
    <button name="Heater 2" class="drum-pad">W<audio class="clip" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3" id="W"></audio></button>
    <button name="Heater 3" class="drum-pad">E<audio class="clip" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3" id="E"></audio></button>
    <button name="Heater 4" class="drum-pad">A<audio class="clip" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3" id="A"></audio></button>
    <button name="Clap" class="drum-pad">S<audio class="clip" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3" id="S"></audio></button>
    <button name="Open-HH" class="drum-pad">D<audio class="clip" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3" id="D"></audio></button>
    <button name="Kick-n'-Hat" class="drum-pad">Z<audio class="clip" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3" id="Z"></audio></button>
    <button name="kick" class="drum-pad">X<audio class="clip" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3" id="X"></audio></button>
    <button name="Closed-HH" class="drum-pad">C<audio class="clip" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3" id="C"></audio></button>
  </div>
</div>

  </body>
  <script src="script.js"></script>
</html>
